services:
  postgres:
    image: postgres:18-alpine
    container_name: darts-postgres
    environment:
      POSTGRES_USER: darts
      POSTGRES_PASSWORD: darts123
      POSTGRES_DB: dartsdb
      # PG 18+ stores data under /var/lib/postgresql/<version>/docker (set automatically)
    ports:
      - "5432:5432"
    volumes:
      # PG 18+ requires mounting the parent directory, not /data directly.
      # The image creates versioned subdirectories (e.g. 18/docker) under this path.
      - postgres_data_18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darts -d dartsdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: darts-api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data_18:
